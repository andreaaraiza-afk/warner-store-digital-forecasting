# Optional. This repo is private; GitHub Pages on a private repository
# needs a paid plan (Pro, Team, or Enterprise). The workflow is included
# so a public or eligible repo can publish dist/, and it is fine if it
# cannot run here.
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # dist/ is already built and committed (node build.js), including the
      # Kokoro MP3 recaps. Publishing that folder avoids running the neural
      # model in CI. Regenerating audio is a local step (scripts/render-recaps.mjs).
      - name: Upload dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
