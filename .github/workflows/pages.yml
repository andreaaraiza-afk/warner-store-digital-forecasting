# Publishes an encrypted static site. The password is the Actions secret
# DASHBOARD_PASSWORD. If that secret is missing, this job fails before upload
# and the previous GitHub Pages deployment stays in place.
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install StatiCrypt
        run: npm install --prefix /tmp/staticrypt-ci --no-fund --no-audit staticrypt@3.5.4

      - name: Build the dashboard
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          RECAP_BASE_URL: ${{ vars.RECAP_BASE_URL }}
        run: node build.js

      - name: Encrypt the site
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          STATICRYPT_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: node scripts/encrypt-site.mjs

      - name: Upload encrypted site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-private/encrypted

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
